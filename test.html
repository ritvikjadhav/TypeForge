<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TypeForge typing speed test — improve your typing speed and accuracy.">
    <title>Typing Test — TypeForge</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/test.css">
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">
        <span>TYPE</span>FORGE
    </a>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="test.html" class="active">Typing Test</a>
        <a href="learn.html">Learn</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>

    <button class="theme-toggle" aria-label="Toggle theme">
        ◐
    </button>
</header>

<main id="typingTest" class="test-page">

    <section class="test-header">
        <div>
            <p class="eyebrow">TYPEFORGE TEST</p>
            <h1>Test your <span>typing speed.</span></h1>
            <p>
                Type the passage below as accurately and quickly
                as you can.
            </p>
        </div>
    </section>

    <section class="test-controls">

        <div class="test-modes">
            <button class="mode-button active" data-time="30">
                30 sec
            </button>

            <button class="mode-button" data-time="60">
                60 sec
            </button>

            <button class="mode-button" data-time="120">
                120 sec
            </button>
        </div>

        <button id="restartTest" class="restart-button">
            ↻ Restart
        </button>

    </section>

    <section class="typing-card">

        <div class="typing-stats">

            <div class="stat">
                <span>Time</span>
                <strong id="timer">30s</strong>
            </div>

            <div class="stat">
                <span>WPM</span>
                <strong id="wpm">0</strong>
            </div>

            <div class="stat">
                <span>Accuracy</span>
                <strong id="accuracy">100%</strong>
            </div>

            <div class="stat">
                <span>Errors</span>
                <strong id="errors">0</strong>
            </div>

        </div>

        <div class="typing-area">

            <div class="typing-passage" id="passage">
                Loading passage...
            </div>

            <textarea
                id="typingInput"
                class="typing-input"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                aria-label="Type the passage"
            ></textarea>

            <p id="testMessage" class="test-message">
                Click the passage and start typing
            </p>

        </div>

        <div class="progress-track">
            <span id="progressBar"></span>
        </div>

    </section>

</main>

<script src="js/main.js"></script>
<script src="js/typing.js"></script>

</body>
                </html>
